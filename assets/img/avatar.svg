<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Avatar do DarknessBot. O "D" vem do letreiro do banner do player (Cinzel Decorative Black,
       SIL OFL 1.1, Natanael Gama), já em contornos; nenhuma fonte é carregada.
       O Discord recorta em círculo: tudo que importa fica dentro de r = 420 a partir do centro. -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0" stop-color="#1d1033"/>
      <stop offset="0.55" stop-color="#140c22"/>
      <stop offset="1" stop-color="#07050c"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#4c1d95" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="letra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="anel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <filter id="brilhoD" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="circulo"><circle cx="512" cy="512" r="420"/></clipPath>
    <filter id="brilho" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="470" fill="url(#glow)"/>
